input {
  beats {
    port => 5044
    ssl => false
  }
  tcp {
    port => 5000
    codec => json
    ssl => false
  }
  udp {
    port => 5000
    codec => json
  }
}

filter {
  if [type] == "24hr-story" {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      timezone => "UTC"
    }
    
    mutate {
      add_field => {
        "[@metadata][target_index]" => "24hr-story-%{+YYYY.MM.dd}"
      }
      remove_field => ["@version", "beat", "input", "prospector"]
    }

    # Add error handling
    if "_jsonparsefailure" in [tags] {
      mutate {
        add_tag => ["_jsonparsefailure"]
        add_field => {
          "error_message" => "Failed to parse JSON"
          "raw_message" => "%{message}"
        }
      }
    }
  }
}

output {
  # Primary output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    retry_on_conflict => 3
    retry_on_status => [429, 503]
    retry_count => 3
    retry_delay => 5
    action => "index"
    document_id => "%{id}"
    template_name => "24hr-story"
    template_overwrite => true
  }

  # Fallback to file if Elasticsearch is down
  if "_elasticsearch_failure" in [tags] {
    file {
      path => "/var/log/logstash/failed-%{+YYYY-MM-dd}.log"
      codec => json
    }
  }

  # Debug output in development
  if [environment] == "development" {
    stdout {
      codec => rubydebug
    }
  }
} 
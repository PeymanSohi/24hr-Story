variables:
  DOCKER_REGISTRY: "registry.gitlab.com"
  APP_NAME: "24hr-story"
  KUBERNETES_NAMESPACE_PROD: "24hr-story-prod"
  KUBERNETES_NAMESPACE_STAGE: "24hr-story-stage"
  KUBERNETES_NAMESPACE_DEV: "24hr-story-dev"
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

stages:
  - code_quality
  - build
  - test
  - security
  - deploy

# Notification template
.notify_slack: &notify_slack
  script:
    - |
      curl -X POST -H 'Content-type: application/json' --data '{
        "text": "Pipeline Status: $CI_PIPELINE_STATUS\n
        Project: $CI_PROJECT_NAME\n
        Branch: $CI_COMMIT_REF_NAME\n
        Commit: $CI_COMMIT_SHORT_SHA\n
        Author: $GITLAB_USER_NAME\n
        Pipeline URL: $CI_PIPELINE_URL\n
        Environment: $CI_ENVIRONMENT_NAME"
      }' $SLACK_WEBHOOK_URL

# Code Quality Stage
code_quality:
  stage: code_quality
  image: node:18
  script:
    - npm install
    - npm run lint
    - npm run format:check
  rules:
    - if: $CI_COMMIT_BRANCH
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
  after_script:
    - *notify_slack

sonarqube_scan:
  stage: code_quality
  image: 
    name: sonarsource/sonar-scanner-cli
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  rules:
    - if: $CI_COMMIT_BRANCH
  allow_failure: true
  after_script:
    - *notify_slack

# Build Stage
build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if [[ "$CI_COMMIT_BRANCH" == "main" ]]; then
        export ENV_TAG="prod"
      elif [[ "$CI_COMMIT_BRANCH" == "stage" ]]; then
        export ENV_TAG="stage"
      else
        export ENV_TAG="dev"
      fi
    - docker build -t $DOCKER_REGISTRY/$CI_PROJECT_PATH/$APP_NAME:$CI_COMMIT_SHA .
    - docker tag $DOCKER_REGISTRY/$CI_PROJECT_PATH/$APP_NAME:$CI_COMMIT_SHA $DOCKER_REGISTRY/$CI_PROJECT_PATH/$APP_NAME:$ENV_TAG
    - docker push $DOCKER_REGISTRY/$CI_PROJECT_PATH/$APP_NAME:$CI_COMMIT_SHA
    - docker push $DOCKER_REGISTRY/$CI_PROJECT_PATH/$APP_NAME:$ENV_TAG
  rules:
    - if: $CI_COMMIT_BRANCH
  after_script:
    - *notify_slack

# Test Stage
unit_test:
  stage: test
  image: node:18
  script:
    - npm install
    - npm run test
  rules:
    - if: $CI_COMMIT_BRANCH
  artifacts:
    reports:
      junit: junit.xml
  after_script:
    - *notify_slack

integration_test:
  stage: test
  image: node:18
  services:
    - redis:latest
    - rabbitmq:latest
    - minio/minio:latest
  script:
    - npm install
    - npm run test:integration
  rules:
    - if: $CI_COMMIT_BRANCH
  artifacts:
    reports:
      junit: integration-test-report.xml
  after_script:
    - *notify_slack

e2e_test:
  stage: test
  image: cypress/included:12.8.1
  script:
    - npm install
    - npm run test:e2e
  rules:
    - if: $CI_COMMIT_BRANCH
  artifacts:
    reports:
      junit: cypress-report.xml
    paths:
      - cypress/videos/
      - cypress/screenshots/
  after_script:
    - *notify_slack

# Security Stage
container_scanning:
  stage: security
  image: aquasec/trivy:latest
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $DOCKER_REGISTRY/$CI_PROJECT_PATH/$APP_NAME:$CI_COMMIT_SHA
  cache:
    paths:
      - .trivycache/
  rules:
    - if: $CI_COMMIT_BRANCH
  allow_failure: true
  after_script:
    - *notify_slack

dependency_scanning:
  stage: security
  image: node:18
  script:
    - npm install
    - npm audit
    - npm audit fix --audit-level=critical
  rules:
    - if: $CI_COMMIT_BRANCH
  allow_failure: true
  after_script:
    - *notify_slack

# Deploy Stage
.deploy_template: &deploy_template
  image: 
    name: alpine/helm:3.11.1
    entrypoint: [""]
  script:
    - helm upgrade --install --namespace $KUBE_NAMESPACE
      --set image.repository=$DOCKER_REGISTRY/$CI_PROJECT_PATH/$APP_NAME
      --set image.tag=$CI_COMMIT_SHA
      --set environment=$CI_ENVIRONMENT_NAME
      $APP_NAME ./helm/24hr-story
  after_script:
    - *notify_slack

deploy_dev:
  <<: *deploy_template
  stage: deploy
  variables:
    KUBE_NAMESPACE: $KUBERNETES_NAMESPACE_DEV
  environment:
    name: development
    url: https://dev.24hr-story.com
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_stage:
  <<: *deploy_template
  stage: deploy
  variables:
    KUBE_NAMESPACE: $KUBERNETES_NAMESPACE_STAGE
  environment:
    name: staging
    url: https://stage.24hr-story.com
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"

deploy_prod:
  <<: *deploy_template
  stage: deploy
  variables:
    KUBE_NAMESPACE: $KUBERNETES_NAMESPACE_PROD
  environment:
    name: production
    url: https://24hr-story.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual 